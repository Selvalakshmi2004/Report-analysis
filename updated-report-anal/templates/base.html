<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>{% block title %}My Project{% endblock %}</title>
    <style>
        body {
            background-color: #181717;
            color: #8e8b8b;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background-color: #6a1b9a; /* Purple */
            padding: 15px;
            text-align: center;
            transition: background-color 0.3s;
        }
        .navbar a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }
        .navbar a:hover {
            background-color: #4a0072; /* Darker purple */
        }
        .navbar a::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0;
            height: 2px;
            background: white;
            transition: width 0.3s, left 0.3s;
        }
        .navbar a:hover::after {
            width: 100%;
            left: 0;
        }
        .container {
            padding: 20px;
        }
        .image {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
        }

        h1 {
        color: #6a1b9a;
        margin-bottom: 20px;
    }
    h2 {
        color: #6a1b9a;
        margin-top: 30px;
        margin-bottom: 20px;
    }
    
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('upload_image') }}">Scan</a>
        <a href="{{ url_for('details') }}">Details</a>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
